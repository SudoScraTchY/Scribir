<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgRibbon" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Speaker 1 Gradient: Electric Indigo -->
    <linearGradient id="spk1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Speaker 2 Gradient: Warm Coral Amber -->
    <linearGradient id="spk2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Speaker 3 Gradient: Vivid Cyan Teal -->
    <linearGradient id="spk3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgRibbon)"/>

  <!-- Conversational Harmonic Orbit (Soundwave Circle) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 10"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Interwoven Speaker Ribbons forming "S" & Dialogue Flow -->
  <g filter="url(#ribbonGlow)">
    
    <!-- RIBBON 1 (Speaker 1 - Indigo): Sweeping Upper Arch to Center Turn -->
    <path d="M360,140 C320,95 210,95 165,140 C120,185 140,245 220,265 L300,285 C370,305 385,365 345,405 C305,445 200,445 150,395" 
          fill="none" stroke="url(#spk1)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- RIBBON 2 (Speaker 2 - Warm Amber): Intertwined Counter-Curve -->
    <path d="M150,145 C190,105 295,105 340,150 C385,195 365,250 290,270 L215,290 C145,310 135,370 175,410 C215,450 315,450 365,400" 
          fill="none" stroke="url(#spk2)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- RIBBON 3 (Speaker 3 - Teal): Central Synchronizing Voice Core -->
    <path d="M210,185 C240,165 285,165 305,185 C325,205 315,235 275,250 L235,265 C195,280 185,310 205,330 C225,350 270,350 300,330" 
          fill="none" stroke="url(#spk3)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

    <!-- Node Points (Speaker Calibration Turns) -->
    <circle cx="165" cy="140" r="10" fill="#A5B4FC"/>
    <circle cx="340" cy="150" r="8" fill="#FDE68A"/>
    <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>
    <circle cx="175" cy="410" r="8" fill="#FDE68A"/>
    <circle cx="345" cy="405" r="10" fill="#A5B4FC"/>
  </g>

  <!-- Soundwave Nodes along Ribbons -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="210" cy="115" r="3"/>
    <circle cx="280" cy="110" r="4"/>
    <circle cx="230" cy="400" r="4"/>
    <circle cx="300" cy="395" r="3"/>
  </g>

  <!-- Precision Outer Frame -->
  <rect x="22" y="22" width="468" height="468" rx="95" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
