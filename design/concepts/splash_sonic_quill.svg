<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Deep Obsidian Slate Radial Background -->
    <radialGradient id="bgSlateDeep" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181E2E"/>
      <stop offset="45%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>

    <!-- Metallic Quill Gradient -->
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Sonic Pulse Line Gradient -->
    <linearGradient id="sonicLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1920" fill="url(#bgSlateDeep)"/>

  <!-- Minimal Modern Architectural Framing -->
  <rect x="60" y="60" width="960" height="1800" rx="36" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Top Acoustic Resonance Rings -->
  <g transform="translate(540, 260)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="#818CF8" filter="url(#neonPulse)"/>
  </g>

  <!-- Central Visual: The Sonic Quill Tracing Acoustic Waveforms -->
  <g transform="translate(540, 780)">
    <!-- Expanding Radial Soundwave Rings from the Stylus -->
    <circle cx="0" cy="200" r="320" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="0" cy="200" r="240" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="10 14"/>
    <circle cx="0" cy="200" r="160" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Aerodynamic Stylus / Quill Body -->
    <path d="M0,-140 C-80,-60 -130,50 -130,160 C-130,220 -50,270 0,290 C50,270 130,220 130,160 C130,50 80,-60 0,-140 Z" 
          fill="url(#quillGrad)" stroke="#475569" stroke-width="2"/>

    <!-- Inner Core & Breather Diaphragm -->
    <circle cx="0" cy="30" r="26" fill="#0E131F" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="0" cy="30" r="10" fill="#38BDF8" filter="url(#neonPulse)"/>

    <!-- Slit Waveform (Soundwaves inside the nib) -->
    <g filter="url(#neonPulse)">
      <line x1="0" y1="56" x2="0" y2="290" stroke="url(#sonicLine)" stroke-width="6" stroke-linecap="round"/>
      <!-- Equalizer Bars -->
      <line x1="-50" y1="120" x2="50" y2="120" stroke="url(#sonicLine)" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70" y1="155" x2="70" y2="155" stroke="url(#sonicLine)" stroke-width="5" stroke-linecap="round"/>
      <line x1="-85" y1="190" x2="85" y2="190" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line x1="-65" y1="225" x2="65" y2="225" stroke="url(#sonicLine)" stroke-width="5" stroke-linecap="round"/>
      <line x1="-35" y1="260" x2="35" y2="260" stroke="url(#sonicLine)" stroke-width="4" stroke-linecap="round"/>

      <!-- Nib Tip Spark -->
      <circle cx="0" cy="292" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Transcribed Waveform Trail flowing out of the Nib -->
    <path d="M-280,350 Q-140,310 0,350 T280,350" fill="none" stroke="url(#sonicLine)" stroke-width="4" stroke-linecap="round" filter="url(#neonPulse)"/>
    <path d="M-220,380 Q-110,345 0,380 T220,380" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Waveform freezing into text lines -->
    <g fill="#94A3B8" opacity="0.6">
      <rect x="-180" y="420" width="70" height="6" rx="3"/>
      <rect x="-100" y="420" width="110" height="6" rx="3"/>
      <rect x="20" y="420" width="60" height="6" rx="3"/>
      <rect x="90" y="420" width="90" height="6" rx="3"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="540" y="1320" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="14" fill="#FFFFFF" text-anchor="middle" filter="url(#neonPulse)">
    SCRIBIR
  </text>
  
  <text x="540" y="1375" font-family="'Inter', sans-serif" font-size="18" font-weight="500" letter-spacing="6" fill="#94A3B8" text-anchor="middle">
    TRANSCRIBE • DIARIZE • SOVEREIGN
  </text>

  <!-- Progress Bar & Model Loading Telemetry -->
  <g transform="translate(540, 1530)">
    <!-- Track -->
    <rect x="-240" y="-3" width="480" height="6" rx="3" fill="#1E293B"/>
    
    <!-- Active Glow Progress -->
    <rect x="-240" y="-3" width="310" height="6" rx="3" fill="url(#sonicLine)" filter="url(#neonPulse)"/>
    
    <!-- Telemetry Status -->
    <text x="0" y="50" font-family="'Courier New', monospace" font-size="15" letter-spacing="2" fill="#38BDF8" text-anchor="middle">
      WARMING ON-DEVICE NEURAL MODELS [ONNX]
    </text>

    <!-- Badge -->
    <g transform="translate(0, 110)">
      <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
      <circle cx="-110" cy="0" r="4" fill="#10B981"/>
      <text x="12" y="5" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#E2E8F0" text-anchor="middle">
        100% PRIVATE • ZERO CLOUD
      </text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="540" y="1810" font-family="'Inter', sans-serif" font-size="13" letter-spacing="4" fill="#475569" text-anchor="middle">
    LOCAL INTELLIGENCE ENGINE
  </text>
</svg>
