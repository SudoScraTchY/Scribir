<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Isometric Ancient Persian Quill + Diamond Soundwave Ripples -->
  <!-- Zero Text • Zero Loading Bar -->
  <g transform="translate(256, 240)">
    
    <!-- Concentric Isometric Diamond Soundwave Ripples -->
    <!-- Diamond Ripple 1 (Outer - Faint Gold) -->
    <polygon points="0,-160 215,0 0,160 -215,0" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 8"/>
    
    <!-- Diamond Ripple 2 (Mid - Vibrant Susa Turquoise) -->
    <polygon points="0,-115 155,0 0,115 -155,0" fill="none" stroke="#4EECD6" stroke-width="2.5" stroke-opacity="0.45"/>
    
    <!-- Diamond Ripple 3 (Inner - Warm Electrum Gold) -->
    <polygon points="0,-70 95,0 0,70 -95,0" fill="none" stroke="#F3C644" stroke-width="3" stroke-opacity="0.7"/>

    <!-- Acoustic Contact Nodes along Diamond Perimeters -->
    <circle cx="-155" cy="0" r="4.5" fill="#4EECD6" opacity="0.8"/>
    <circle cx="155" cy="0" r="4.5" fill="#4EECD6" opacity="0.8"/>
    <circle cx="0" cy="-115" r="4" fill="#F3C644" opacity="0.7"/>
    <circle cx="0" cy="115" r="4" fill="#F3C644" opacity="0.7"/>

    <!-- Central Isometric Ancient Persian Quill Pen -->
    <g transform="translate(0, -50)">
      <!-- Quill Upper Shaft (Top Face - Bright Electrum #FFF6D1) -->
      <polygon points="0,-100 40,-125 68,-78 28,-53" fill="#FFF6D1"/>
      
      <!-- Quill Upper Shaft (Left Face - Warm Gold #F3C644) -->
      <polygon points="0,-100 28,-53 -28,-21 -56,-68" fill="#F3C644"/>

      <!-- Beveled Chisel Nib (Left Blade - Gold Midtone #D4AF37) -->
      <polygon points="-28,-21 28,-53 0,55" fill="#D4AF37"/>

      <!-- Beveled Chisel Nib (Right Blade - Gold Bronze #9A7B1C) -->
      <polygon points="28,-53 68,-78 0,55" fill="#9A7B1C"/>

      <!-- Isometric Nib Slit (Negative Space #0D1B36) -->
      <polygon points="0,-15 10,-27 0,50 -10,27" fill="#0D1B36"/>

      <!-- Nib Tip Writing Spark (Pure White) -->
      <polygon points="0,42 11,35 0,58 -11,50" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
