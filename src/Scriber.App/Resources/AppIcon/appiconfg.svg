<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Isometric Ancient Persian Quill (Style A) -->
  <!-- Designed for 48x48 Android Adaptive Icon safe zone -->
  <g transform="translate(256, 240)">
    
    <!-- 3 Isometric Soundwave Equalizer Columns -->
    <!-- Column 1 (Left - Susa Turquoise): x = -75 -->
    <g transform="translate(-75, 45)">
      <!-- Top Face -->
      <polygon points="0,-18 25,-32 50,-18 25,-4" fill="#4EECD6"/>
      <!-- Left Face -->
      <polygon points="0,-18 25,-4 25,32 0,18" fill="#0E8388"/>
      <!-- Right Face -->
      <polygon points="25,-4 50,-18 50,18 25,32" fill="#075E61"/>
    </g>

    <!-- Column 2 (Center - Point of Quill Contact / Achaemenid Gold): x = 0 -->
    <g transform="translate(-25, 75)">
      <!-- Top Face -->
      <polygon points="0,-30 25,-45 50,-30 25,-15" fill="#FFF2B2"/>
      <!-- Left Face -->
      <polygon points="0,-30 25,-15 25,45 0,30" fill="#D4AF37"/>
      <!-- Right Face -->
      <polygon points="25,-15 50,-30 50,30 25,45" fill="#9A7B1C"/>
    </g>

    <!-- Column 3 (Right - Susa Turquoise): x = 75 -->
    <g transform="translate(25, 30)">
      <!-- Top Face -->
      <polygon points="0,-15 25,-29 50,-15 25,-1" fill="#4EECD6"/>
      <!-- Left Face -->
      <polygon points="0,-15 25,-1 25,28 0,14" fill="#0E8388"/>
      <!-- Right Face -->
      <polygon points="25,-1 50,-15 50,14 25,28" fill="#075E61"/>
    </g>

    <!-- Isometric Ancient Persian Quill Pen -->
    <g transform="translate(0, -45)">
      <!-- Quill Upper Shaft (Top Face - Bright Electrum) -->
      <polygon points="0,-100 40,-125 68,-78 28,-53" fill="#FFF6D1"/>
      
      <!-- Quill Upper Shaft (Left Face - Warm Gold) -->
      <polygon points="0,-100 28,-53 -28,-21 -56,-68" fill="#F3C644"/>

      <!-- Beveled Chisel Nib (Left Blade) -->
      <polygon points="-28,-21 28,-53 0,55" fill="#D4AF37"/>

      <!-- Beveled Chisel Nib (Right Blade) -->
      <polygon points="28,-53 68,-78 0,55" fill="#9A7B1C"/>

      <!-- Isometric Nib Slit (Negative Space) -->
      <polygon points="0,-15 10,-27 0,50 -10,27" fill="#0D1B36"/>

      <!-- Nib Tip Contact Spark -->
      <polygon points="0,42 11,35 0,58 -11,50" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
